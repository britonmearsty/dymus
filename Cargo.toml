[package]
name = "dymus"
version = "0.2.0"
edition = "2024"
description = "A keyboard-driven YouTube Music terminal player"
readme = "README.md"
repository = "https://github.com/britonmearsty/dymus"
license = "MIT"
keywords = ["music", "tui", "youtube-music", "terminal", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
rust-version = "1.88"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.7"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
mpris-server = { version = "0.10", features = ["tokio"] }
